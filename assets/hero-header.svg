<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#091021" />
      <stop offset="100%" stop-color="#070b18" />
    </linearGradient>
    <radialGradient id="auraGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 60) scale(280 180)">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auraCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(720 140) scale(240 190)">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="40" y1="60" x2="430" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="880" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.55" />
    </pattern>
    <clipPath id="typeMask">
      <rect x="44" y="182" width="540" height="34">
        <animate attributeName="width" values="0;535;535;0" keyTimes="0;0.42;0.88;1" dur="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
    @keyframes pulseDot { 0%, 100% { opacity: 1; r: 4.5; } 50% { opacity: 0.45; r: 6; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    .cursor { animation: blink 0.9s step-end infinite; }
    .live-dot { animation: pulseDot 2s ease-in-out infinite; }
    .orbit-1 { transform-origin: 725px 128px; animation: spinSlow 22s linear infinite; }
    .orbit-2 { transform-origin: 725px 128px; animation: spinRev 15s linear infinite; }
    .core-float { animation: floatY 4s ease-in-out infinite; }
  </style>

  <!-- Base Card -->
  <rect x="1.5" y="1.5" width="877" height="257" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#grid)" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#auraGreen)" />
  <rect x="2" y="2" width="876" height="256" rx="18" fill="url(#auraCyan)" />

  <!-- Top HUD Status Bar -->
  <circle class="live-dot" cx="46" cy="36" r="4.5" fill="#00ff88" />
  <text x="60" y="40" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="2" fill="#00ff88">SYSTEMS ONLINE // KERNEL VERIFIED</text>
  <rect x="44" y="52" width="160" height="1.5" fill="#00ff88" fill-opacity="0.35" />

  <!-- Main Title -->
  <text x="42" y="114" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="3" fill="url(#titleGrad)">SYLENTHAI</text>
  <text x="44" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.8" fill="#cbd5e1">
    AI Systems Architect  ·  Formal Verification (Lean 4)  ·  Full-Stack Builder
  </text>

  <!-- Animated Terminal Strip -->
  <rect x="34" y="176" width="560" height="44" rx="10" fill="#03060d" fill-opacity="0.92" stroke="#1e293b" stroke-width="1.2" />
  <g clip-path="url(#typeMask)">
    <text x="48" y="203" font-family="'Cascadia Code', Consolas, monospace" font-size="14.5" font-weight="600" fill="#00ff88">
      $ lake build ProjectGenesis &amp;&amp; sylenth-agents deploy --prod
    </text>
  </g>
  <rect class="cursor" x="568" y="190" width="9" height="18" rx="1.5" fill="#00d4ff" />

  <!-- Right Side Futuristic Orbital AI Core -->
  <g class="core-float">
    <!-- Outer dashed orbit -->
    <g class="orbit-1">
      <circle cx="725" cy="128" r="84" stroke="#00d4ff" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="8 6" />
      <circle cx="725" cy="44" r="5" fill="#00ff88" />
      <circle cx="809" cy="128" r="4.5" fill="#00d4ff" />
      <circle cx="665" cy="187" r="4" fill="#8b5cf6" />
    </g>

    <!-- Inner counter-rotating orbit -->
    <g class="orbit-2">
      <circle cx="725" cy="128" r="58" stroke="#00ff88" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="22 10" />
      <circle cx="725" cy="186" r="4.5" fill="#00ff88" />
      <circle cx="675" cy="98" r="4" fill="#00d4ff" />
    </g>

    <!-- Hexagon Neural Core -->
    <polygon points="725,94 754,111 754,145 725,162 696,145 696,111" fill="#0b1326" stroke="#00d4ff" stroke-width="2" />
    <polygon points="725,105 744,116 744,140 725,151 706,140 706,116" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-width="1.4" />
    <text x="725" y="133" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="13" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
  </g>
</svg>
