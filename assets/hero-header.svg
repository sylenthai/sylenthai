<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#11161f" />
      <stop offset="100%" stop-color="#0b0f14" />
    </linearGradient>
    <radialGradient id="auraSubtle" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(725 128) scale(210 170)">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="40" y1="60" x2="430" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#9ea7b3" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.6" stroke-opacity="0.7" />
    </pattern>
    <clipPath id="typeMask">
      <rect x="44" y="182" width="540" height="34">
        <animate attributeName="width" values="0;535;535;0" keyTimes="0;0.42;0.88;1" dur="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.1; } }
    @keyframes pulseDot { 0%, 100% { opacity: 1; r: 4; } 50% { opacity: 0.4; r: 5.2; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    .cursor { animation: blink 0.9s step-end infinite; }
    .live-dot { animation: pulseDot 2.2s ease-in-out infinite; }
    .orbit-1 { transform-origin: 725px 128px; animation: spinSlow 28s linear infinite; }
    .orbit-2 { transform-origin: 725px 128px; animation: spinRev 18s linear infinite; }
    .core-float { animation: floatY 4.5s ease-in-out infinite; }
  </style>

  <!-- Base Card -->
  <rect x="1.5" y="1.5" width="877" height="257" rx="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.4" />
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#grid)" />
  <rect x="2" y="2" width="876" height="256" rx="14" fill="url(#auraSubtle)" />

  <!-- Top HUD Status Bar -->
  <circle class="live-dot" cx="46" cy="36" r="4" fill="#3fb950" />
  <text x="60" y="40" font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.8" fill="#3fb950">SYS.ONLINE // KERNEL_VERIFIED</text>
  <rect x="44" y="52" width="220" height="1" fill="#30363d" />

  <!-- Main Title -->
  <text x="42" y="112" font-family="'Cascadia Code', Consolas, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="4" fill="url(#titleGrad)">SYLENTHAI</text>
  <text x="44" y="144" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" letter-spacing="0.6" fill="#8b949e">
    AI Systems Architect  ·  Formal Verification (Lean 4)  ·  Full-Stack Builder
  </text>

  <!-- Classic Unix Terminal Strip -->
  <rect x="34" y="176" width="560" height="44" rx="8" fill="#090c10" stroke="#21262d" stroke-width="1.2" />
  <g clip-path="url(#typeMask)">
    <text x="48" y="203" font-family="'Cascadia Code', Consolas, monospace" font-size="14" font-weight="500" fill="#56d364">
      sylenthai@core:~$ lake build ProjectGenesis &amp;&amp; ./deploy.sh
    </text>
  </g>
  <rect class="cursor" x="568" y="190" width="8" height="17" rx="1" fill="#3fb950" />

  <!-- Right Side Classic Geometric Radar / Core -->
  <g class="core-float">
    <line x1="628" y1="128" x2="822" y2="128" stroke="#21262d" stroke-width="1" stroke-dasharray="3 4" />
    <line x1="725" y1="32" x2="725" y2="224" stroke="#21262d" stroke-width="1" stroke-dasharray="3 4" />

    <g class="orbit-1">
      <circle cx="725" cy="128" r="82" stroke="#30363d" stroke-width="1.3" stroke-dasharray="7 6" />
      <circle cx="725" cy="46" r="4.5" fill="#3fb950" />
      <circle cx="807" cy="128" r="3.5" fill="#8b949e" />
      <circle cx="667" cy="186" r="3.5" fill="#d29922" />
    </g>

    <g class="orbit-2">
      <circle cx="725" cy="128" r="56" stroke="#2ea043" stroke-opacity="0.5" stroke-width="1.3" stroke-dasharray="18 10" />
      <circle cx="725" cy="184" r="4" fill="#56d364" />
      <circle cx="677" cy="99" r="3.5" fill="#79c0ff" />
    </g>

    <polygon points="725,94 754,111 754,145 725,162 696,145 696,111" fill="#161b22" stroke="#30363d" stroke-width="1.8" />
    <polygon points="725,105 744,116 744,140 725,151 706,140 706,116" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-width="1.2" />
    <text x="725" y="133" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">&gt;_</text>
  </g>
</svg>
