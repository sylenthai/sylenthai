  <text x="618" y="76" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#d29922">[0x03] TARGET SYSTEMS</text>
  <circle class="led" cx="842" cy="72" r="3" fill="#d29922" />
  <line x1="618" y1="86" x2="846" y2="86" stroke="#21262d" stroke-width="1" />
  <text x="618" y="106" font-family="'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">Mobile &amp; Tooling</text>
  <text x="618" y="126" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#8b949e">Kotlin Android · React Native</text>
