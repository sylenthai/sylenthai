<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215" fill="none">
  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    .bus { stroke-dasharray: 4 4; animation: flow 1.5s linear infinite; }
    .led { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect x="1" y="1" width="878" height="213" rx="10" fill="#0b0f14" stroke="#21262d" stroke-width="1.2" />
  <text x="22" y="26" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.4" fill="#6e7681">ARCHITECTURE TOPOLOGY // END-TO-END PIPELINE</text>
  <line x1="20" y1="36" x2="860" y2="36" stroke="#161b22" stroke-width="1" />

  <!-- Bus Connectors -->
  <line class="bus" x1="276" y1="112" x2="318" y2="112" stroke="#3fb950" stroke-width="1.5" />
  <line class="bus" x1="562" y1="112" x2="604" y2="112" stroke="#79c0ff" stroke-width="1.5" />

  <!-- Animated signal packets -->
  <circle cx="276" cy="112" r="2.8" fill="#56d364">
    <animate attributeName="cx" values="276;318" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="562" cy="112" r="2.8" fill="#79c0ff">
    <animate attributeName="cx" values="562;604" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- NODE 01: FORMAL KERNEL -->
