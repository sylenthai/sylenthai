  <!-- Bottom Telemetry Strip -->
  <text x="22" y="198" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#6e7681">
    INVARIANT: 2^k · F^k(n) = 3^{w_k} · n + C_k   |   Target A ∧ Target B → GlobalCollatzConjecture   |   DOI: 10.5281/zenodo.24422524
  </text>
</svg>
