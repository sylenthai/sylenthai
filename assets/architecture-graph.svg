  <text x="34" y="76" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#3fb950">[0x01] FORMAL KERNEL</text>
  <circle class="led" cx="258" cy="72" r="3" fill="#3fb950" />
  <line x1="34" y1="86" x2="262" y2="86" stroke="#21262d" stroke-width="1" />
  <text x="34" y="106" font-family="'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">Project Genesis</text>
  <text x="34" y="126" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#8b949e">Lean 4 v4.12 · Zero Mathlib</text>
  <text x="34" y="144" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#8b949e">104 decls · Mod-2^30 decay</text>
  <text x="34" y="161" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#3fb950">STATUS: 0 sorry / 0 axioms</text>

  <!-- NODE 02: AGENT MESH -->
  <rect x="318" y="54" width="244" height="118" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
  <text x="332" y="76" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#79c0ff">[0x02] AGENT MESH</text>
  <circle class="led" cx="544" cy="72" r="3" fill="#79c0ff" />
  <line x1="332" y1="86" x2="548" y2="86" stroke="#21262d" stroke-width="1" />
  <text x="332" y="106" font-family="'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700" fill="#e6edf3">SYLENTH Codes</text>
  <text x="332" y="126" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#8b949e">FastAPI · pgvector · Redis</text>
  <text x="332" y="144" font-family="'Cascadia Code', Consolas, monospace" font-size="11" fill="#8b949e">Orchestrator · QA · SecOps</text>
  <text x="332" y="161" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#79c0ff">BUS: WebSocket + Celery</text>

