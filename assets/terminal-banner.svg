<svg xmlns="http://www.w3.org/2000/svg" width="680" height="72" viewBox="0 0 680 72" fill="none">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typeReveal {
      0% { width: 0; }
      35% { width: 510px; }
      85% { width: 510px; }
      100% { width: 0; }
    }
    @keyframes glowPulse {
      0%, 100% { stroke: #00ff41; stroke-opacity: 0.45; }
      50% { stroke: #00ff41; stroke-opacity: 0.9; }
    }
    .box {
      fill: #050806;
      stroke-width: 1.5;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .prompt {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 22px;
      font-weight: 700;
      fill: #00ff41;
      filter: drop-shadow(0 0 6px rgba(0, 255, 65, 0.45));
    }
    .cmd-clip {
      animation: typeReveal 7s steps(36, end) infinite;
    }
    .cursor {
      fill: #00ff41;
      animation: blink 0.9s step-end infinite;
    }
    .dots-r { fill: #ff5f56; }
    .dots-y { fill: #ffbd2e; }
    .dots-g { fill: #27c93f; }
  </style>

  <rect class="box" x="2" y="2" width="676" height="68" rx="8" />
  <circle class="dots-r" cx="20" cy="18" r="4.5" />
  <circle class="dots-y" cx="35" cy="18" r="4.5" />
  <circle class="dots-g" cx="50" cy="18" r="4.5" />

  <clipPath id="typing-mask">
    <rect class="cmd-clip" x="22" y="26" width="510" height="36" />
  </clipPath>

  <g clip-path="url(#typing-mask)">
    <text class="prompt" x="24" y="51">sylenthai@localhost:~# ./build --ai --lean4</text>
  </g>
  <rect class="cursor" x="536" y="32" width="11" height="22" rx="1" />
</svg>
