<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215" fill="none">
  <defs>
    <linearGradient id="c1Bg" x1="0" y1="0" x2="280" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12171f" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes ecgDraw {
      0% { stroke-dashoffset: 260; opacity: 0.35; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -260; opacity: 0.3; }
    }
    .node-pulse { transform-box: fill-box; transform-origin: center; animation: pulseRing 2.6s ease-in-out infinite; }
    .wire { stroke-dasharray: 5 5; animation: dashMove 2s linear infinite; }
    .ecg { stroke-dasharray: 260; stroke-dashoffset: 260; animation: ecgDraw 3.8s ease-in-out infinite; }
  </style>

  <!-- CARD 1: Project Genesis -->
  <rect x="2" y="4" width="280" height="205" rx="12" fill="url(#c1Bg)" stroke="#30363d" stroke-width="1.3" />
  <rect x="20" y="22" width="114" height="22" rx="5" fill="#238636" fill-opacity="0.2" stroke="#2ea043" stroke-opacity="0.45" stroke-width="0.8" />
