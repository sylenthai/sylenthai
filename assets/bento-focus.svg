<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215" fill="none">
  <defs>
    <linearGradient id="c1Bg" x1="0" y1="0" x2="280" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091322" />
      <stop offset="100%" stop-color="#070c17" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="590" y1="150" x2="850" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes waveFlow {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .node-pulse { transform-box: fill-box; transform-origin: center; animation: pulseRing 2.4s ease-in-out infinite; }
    .wire { stroke-dasharray: 5 5; animation: dashMove 1.8s linear infinite; }
    .ecg { stroke-dasharray: 260; stroke-dashoffset: 260; animation: ecgDraw 3.5s ease-in-out infinite; }
    @keyframes ecgDraw {
      0% { stroke-dashoffset: 260; opacity: 0.3; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -260; opacity: 0.2; }
    }
  </style>

  <!-- CARD 1: Project Genesis -->
  <rect x="2" y="4" width="280" height="205" rx="16" fill="url(#c1Bg)" stroke="#00ff88" stroke-opacity="0.4" stroke-width="1.4" />
  <rect x="20" y="22" width="112" height="22" rx="6" fill="#00ff88" fill-opacity="0.14" />
  <text x="30" y="37" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00ff88">LEAN 4 · v4.12.0</text>
  <text x="20" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Project Genesis</text>
  <text x="20" y="96" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">Zero-Mathlib kernel-verified</text>
  <text x="20" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">3n + 1 obstructions &amp; proofs.</text>
  <!-- Mini animated DAG -->
  <line class="wire" x1="36" y1="158" x2="104" y2="144" stroke="#00ff88" stroke-width="1.6" />
  <line class="wire" x1="36" y1="158" x2="104" y2="174" stroke="#00d4ff" stroke-width="1.6" />
  <line class="wire" x1="104" y1="144" x2="174" y2="158" stroke="#00ff88" stroke-width="1.6" />
  <line class="wire" x1="104" y1="174" x2="174" y2="158" stroke="#00d4ff" stroke-width="1.6" />
  <circle class="node-pulse" cx="36" cy="158" r="6" fill="#00ff88" />
  <circle cx="104" cy="144" r="5" fill="#00d4ff" />
  <circle cx="104" cy="174" r="5" fill="#00d4ff" />
  <circle class="node-pulse" cx="174" cy="158" r="7" fill="#00ff88" />
  <text x="194" y="162" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00ff88">0 sorry</text>

  <!-- CARD 2: SYLENTH Codes -->
  <rect x="300" y="4" width="280" height="205" rx="16" fill="url(#c1Bg)" stroke="#00d4ff" stroke-opacity="0.45" stroke-width="1.4" />
  <rect x="318" y="22" width="128" height="22" rx="6" fill="#00d4ff" fill-opacity="0.14" />
  <text x="328" y="37" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" fill="#00d4ff">MULTI-AGENT AI</text>
  <text x="318" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">SYLENTH Codes</text>
  <text x="318" y="96" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">Mobile-first AI dev ecosystem</text>
  <text x="318" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">FastAPI · pgvector · React Native</text>
  <!-- Agent Mesh -->
  <rect x="318" y="142" width="76" height="26" rx="6" fill="#0f172a" stroke="#00d4ff" stroke-width="1.2" />
  <text x="356" y="159" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="10" fill="#00d4ff">ORCH</text>
  <line class="wire" x1="394" y1="155" x2="432" y2="155" stroke="#00d4ff" stroke-width="1.5" />
  <rect x="432" y="136" width="62" height="18" rx="5" fill="#0f172a" stroke="#00ff88" stroke-width="1" />
  <text x="463" y="149" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#00ff88">API/DB</text>
  <rect x="432" y="160" width="62" height="18" rx="5" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
  <text x="463" y="173" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="9.5" fill="#c4b5fd">QA/OPS</text>
  <circle class="node-pulse" cx="536" cy="155" r="8" fill="#00d4ff" fill-opacity="0.25" stroke="#00d4ff" stroke-width="1.5" />
  <circle cx="536" cy="155" r="3.5" fill="#00ff88" />

  <!-- CARD 3: Mobile & Infra -->
  <rect x="598" y="4" width="280" height="205" rx="16" fill="url(#c1Bg)" stroke="#8b5cf6" stroke-opacity="0.48" stroke-width="1.4" />
  <rect x="616" y="22" width="136" height="22" rx="6" fill="#8b5cf6" fill-opacity="0.18" />
  <text x="626" y="37" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" fill="#c4b5fd">MOBILE &amp; SYSTEMS</text>
  <text x="616" y="72" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Full-Stack Craft</text>
  <text x="616" y="96" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">Kotlin Android · Docker · Redis</text>
  <text x="616" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8">PostgreSQL · TypeScript · CI/CD</text>
  <!-- Live ECG / Velocity Sparkline -->
  <path d="M 616 170 L 650 170 L 664 146 L 678 180 L 696 138 L 712 174 L 728 156 L 758 156 L 774 134 L 792 176 L 810 152 L 856 152" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="ecg" d="M 616 170 L 650 170 L 664 146 L 678 180 L 696 138 L 712 174 L 728 156 L 758 156 L 774 134 L 792 176 L 810 152 L 856 152" stroke="url(#waveGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
