  <text x="20" y="114" font-family="system-ui, sans-serif" font-size="12.5" fill="#8b949e">3n + 1 obstructions &amp; proofs.</text>
  <line class="wire" x1="36" y1="158" x2="104" y2="144" stroke="#3fb950" stroke-width="1.5" />
  <line class="wire" x1="36" y1="158" x2="104" y2="174" stroke="#6e7681" stroke-width="1.5" />
  <line class="wire" x1="104" y1="144" x2="174" y2="158" stroke="#3fb950" stroke-width="1.5" />
  <line class="wire" x1="104" y1="174" x2="174" y2="158" stroke="#6e7681" stroke-width="1.5" />
  <circle class="node-pulse" cx="36" cy="158" r="5.5" fill="#3fb950" />
  <circle cx="104" cy="144" r="4.5" fill="#8b949e" />
  <circle cx="104" cy="174" r="4.5" fill="#8b949e" />
  <circle class="node-pulse" cx="174" cy="158" r="6.5" fill="#56d364" />
  <text x="194" y="162" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="600" fill="#3fb950">0 sorry</text>

