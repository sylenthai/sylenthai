    @keyframes scan { 0% { transform: translateY(36px); } 100% { transform: translateY(285px); } }
    .cursor { animation: blink 0.9s step-end infinite; }
    .alive { animation: pulse 2.2s ease-in-out infinite; }
    .scanline { animation: scan 6.5s linear infinite; }
  </style>

