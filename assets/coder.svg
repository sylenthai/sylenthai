<svg xmlns="http://www.w3.org/2000/svg" width="280" height="215" viewBox="0 0 280 215" fill="none">
  <style>
    @keyframes screenGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(63, 185, 80, 0.25)); }
      50% { filter: drop-shadow(0 0 12px rgba(63, 185, 80, 0.45)); }
    }
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(-3px); }
      50% { transform: translateY(4px); }
    }
    @keyframes haloSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .laptop { animation: screenGlow 3.2s ease-in-out infinite; }
    .holo-l { animation: floatA 3.4s ease-in-out infinite; }
    .holo-r { animation: floatB 3.8s ease-in-out infinite; }
    .halo { transform-origin: 140px 88px; animation: haloSpin 24s linear infinite; }
  </style>

  <!-- Floor shadow -->
  <ellipse cx="140" cy="195" rx="98" ry="8" fill="#010409" fill-opacity="0.7" />

  <!-- Subtle orbital ring -->
  <circle class="halo" cx="140" cy="88" r="64" stroke="#30363d" stroke-width="1.2" stroke-dasharray="6 8" />

  <!-- Left Terminal Card -->
  <g class="holo-l">
    <rect x="10" y="34" width="66" height="46" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <rect x="18" y="44" width="32" height="3.5" rx="1.5" fill="#3fb950" />
    <rect x="18" y="52" width="48" height="3.5" rx="1.5" fill="#8b949e" />
    <rect x="18" y="60" width="26" height="3.5" rx="1.5" fill="#6e7681" />
    <rect x="18" y="68" width="40" height="3.5" rx="1.5" fill="#2ea043" />
  </g>

  <!-- Right Proof Card -->
  <g class="holo-r">
    <rect x="204" y="32" width="66" height="46" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
    <rect x="212" y="42" width="42" height="3.5" rx="1.5" fill="#79c0ff" />
    <rect x="212" y="50" width="28" height="3.5" rx="1.5" fill="#3fb950" />
    <rect x="212" y="58" width="48" height="3.5" rx="1.5" fill="#8b949e" />
    <circle cx="256" cy="68" r="3.5" fill="#3fb950" />
  </g>

  <!-- Hoodie & shoulders -->
  <path d="M74 188 C74 136, 98 114, 140 114 C182 114, 206 136, 206 188 Z" fill="#161b22" stroke="#30363d" stroke-width="2.2" />
  <path d="M94 118 C92 64, 112 32, 140 32 C168 32, 188 64, 186 118 Z" fill="#21262d" stroke="#30363d" stroke-width="2.2" />
  <path d="M108 106 C108 72, 122 54, 140 54 C158 54, 172 72, 172 106 C162 116, 118 116, 108 106 Z" fill="#090c10" />

  <!-- Classic terminal visor -->
  <rect x="116" y="79" width="20" height="12" rx="3" fill="#238636" fill-opacity="0.22" stroke="#3fb950" stroke-width="1.6" />
  <rect x="144" y="79" width="20" height="12" rx="3" fill="#238636" fill-opacity="0.22" stroke="#3fb950" stroke-width="1.6" />
  <line x1="136" y1="84" x2="144" y2="84" stroke="#8b949e" stroke-width="1.6" />

  <!-- Laptop -->
  <g class="laptop">
    <rect x="86" y="126" width="108" height="62" rx="7" fill="#0d1117" stroke="#30363d" stroke-width="2" />
    <polygon points="140,141 153,149 153,164 140,172 127,164 127,149" fill="#238636" fill-opacity="0.16" stroke="#3fb950" stroke-width="1.6" />
    <circle cx="140" cy="156.5" r="2.8" fill="#56d364" />
    <rect x="72" y="187" width="136" height="7" rx="3.5" fill="#21262d" stroke="#30363d" stroke-width="1.2" />
  </g>
</svg>
