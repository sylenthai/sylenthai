<svg xmlns="http://www.w3.org/2000/svg" width="280" height="215" viewBox="0 0 280 215" fill="none">
  <style>
    @keyframes screenPulse {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.55)); }
      50% { filter: drop-shadow(0 0 18px rgba(0, 255, 136, 0.75)); }
    }
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(4px); }
    }
    @keyframes haloSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .laptop { animation: screenPulse 3s ease-in-out infinite; }
    .holo-l { animation: floatA 3.2s ease-in-out infinite; }
    .holo-r { animation: floatB 3.6s ease-in-out infinite; }
    .halo { transform-origin: 140px 88px; animation: haloSpin 18s linear infinite; }
  </style>

  <!-- Floor glow -->
  <ellipse cx="140" cy="195" rx="102" ry="9" fill="#00d4ff" fill-opacity="0.18" />

  <!-- Neural halo behind head -->
  <circle class="halo" cx="140" cy="88" r="64" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="6 8" />

  <!-- Left Holographic Code Window -->
  <g class="holo-l">
    <rect x="10" y="34" width="66" height="46" rx="7" fill="#07101f" fill-opacity="0.9" stroke="#00ff88" stroke-width="1.3" />
    <rect x="18" y="44" width="32" height="3.5" rx="1.5" fill="#00ff88" />
    <rect x="18" y="52" width="48" height="3.5" rx="1.5" fill="#00d4ff" fill-opacity="0.8" />
    <rect x="18" y="60" width="26" height="3.5" rx="1.5" fill="#8b5cf6" />
    <rect x="18" y="68" width="40" height="3.5" rx="1.5" fill="#00ff88" fill-opacity="0.65" />
  </g>

  <!-- Right Holographic Proof Window -->
  <g class="holo-r">
    <rect x="204" y="32" width="66" height="46" rx="7" fill="#07101f" fill-opacity="0.9" stroke="#00d4ff" stroke-width="1.3" />
    <rect x="212" y="42" width="42" height="3.5" rx="1.5" fill="#00d4ff" />
    <rect x="212" y="50" width="28" height="3.5" rx="1.5" fill="#00ff88" />
    <rect x="212" y="58" width="48" height="3.5" rx="1.5" fill="#c4b5fd" />
    <circle cx="256" cy="68" r="4" fill="#00ff88" />
  </g>

  <!-- Hoodie & shoulders -->
  <path d="M74 188 C74 136, 98 114, 140 114 C182 114, 206 136, 206 188 Z" fill="#0f172a" stroke="#00d4ff" stroke-width="2.6" />
  <path d="M94 118 C92 64, 112 32, 140 32 C168 32, 188 64, 186 118 Z" fill="#1e293b" stroke="#00d4ff" stroke-width="2.6" />
  <path d="M108 106 C108 72, 122 54, 140 54 C158 54, 172 72, 172 106 C162 116, 118 116, 108 106 Z" fill="#020617" />

  <!-- Glowing cyber visor -->
  <rect x="116" y="79" width="20" height="12" rx="3" fill="#00ff88" fill-opacity="0.18" stroke="#00ff88" stroke-width="2" />
  <rect x="144" y="79" width="20" height="12" rx="3" fill="#00d4ff" fill-opacity="0.18" stroke="#00d4ff" stroke-width="2" />
  <line x1="136" y1="84" x2="144" y2="84" stroke="#00d4ff" stroke-width="2" />

  <!-- Laptop -->
  <g class="laptop">
    <rect x="86" y="126" width="108" height="62" rx="8" fill="#0b1120" stroke="#00d4ff" stroke-width="2.3" />
    <polygon points="140,141 153,149 153,164 140,172 127,164 127,149" fill="#00ff88" fill-opacity="0.16" stroke="#00ff88" stroke-width="2" />
    <circle cx="140" cy="156.5" r="3" fill="#00d4ff" />
    <rect x="72" y="187" width="136" height="7" rx="3.5" fill="#334155" stroke="#00d4ff" stroke-width="1.3" />
  </g>
</svg>
